services:

  frontend:
    build:
      context: ./frontend
    container_name: notes-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: notes-backend
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/notesdb
    depends_on:
      - mongodb
    restart: unless-stopped

  mongodb:
    image: mongo:latest
    container_name: mongodb
    volumes:
      - mongodb-data:/data/db
    restart: unless-stopped

volumes:
  mongodb-data: